# ============================================================
# DO NOT run this file directly with docker compose up!
# Use: make start / make stop / make restart
# or: ./docker/manager.sh start
# See docker.md for full documentation.
# ============================================================
services:
  app:
    build:
      context: .
      args:
        - DOCKER_UID=${DOCKER_UID:-1000}
        - DOCKER_GID=${DOCKER_GID:-1000}
        - DOCKER_SOCKET_GID=${DOCKER_SOCKET_GID:-999}
    ports:
      - "${APP_PORT:-8000}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${VITE_HMR_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - ./docker/logs/nginx:/var/log/nginx
      - ./docker/logs/supervisor:/var/log/supervisor
      - /var/run/docker.sock:/var/run/docker.sock
      - ./shared:/shared
    environment:
      - DOCKER_UID=${DOCKER_UID:-1000}
      - DOCKER_GID=${DOCKER_GID:-1000}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-depthnet}
      - DB_USERNAME=${DB_USERNAME:-depthnet}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-greatsecret}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - VITE_DOCKER_ENV=true
      - VITE_HMR_HOST=${VITE_HMR_HOST:-localhost}
      - VITE_HMR_PORT=${VITE_HMR_PORT:-5173}
      - VITE_CORS_ORIGIN=${VITE_CORS_ORIGIN:-}
      - VITE_POLLING_INTERVAL=${VITE_POLLING_INTERVAL:-1000}
      - CORS_MAX_AGE=${CORS_MAX_AGE:-0}
      - TZ=${TZ:-UTC}
      - BROWSER_SERVICE_URL=${BROWSER_SERVICE_URL:-http://browser-service:3001}
      - VOICE_SERVICE_URL=${VOICE_SERVICE_URL:-http://voice-service:3002}
    hostname: depthnet
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - depthnet

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --tls-version=''
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-depthnet}
      MYSQL_USER: ${DB_USERNAME:-depthnet}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-greatsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      timeout: 20s
      retries: 10
      interval: 5s
      start_period: 15s
    networks:
      - depthnet
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME:-depthnet}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "8001:80"
    depends_on:
      - mysql
    networks:
      - depthnet

  sandbox-manager:
    profiles: ["sandbox", "full"]
    build:
      context: ./sandboxes
      dockerfile: Dockerfile
      args:
        - DOCKER_GID=${DOCKER_SOCKET_GID:-999}
        - HOST_UID=${DOCKER_UID:-1000}
        - HOST_GID=${DOCKER_GID:-1000} 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Access to Docker daemon
      - sandbox_shared:/shared   
      - ./shared:/host_shared:rw                   # Shared data between sandboxes
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - SANDBOX_NETWORK=depthnet_depthnet          # Sandboxes in similar network
      - SANDBOX_PREFIX=depthnet-sandbox            # Container prefixes
      - CLEANUP_TTL=3600                           # One-hour autodelete
      - HOST_SHARED_PATH=${PWD}/shared
      - HOST_UID=${DOCKER_UID:-1000}
      - HOST_GID=${DOCKER_GID:-1000}
      - SANDBOX_MEMORY=${SANDBOX_MEMORY:-512m}
      - SANDBOX_CPUS=${SANDBOX_CPUS:-1.0}
      - SANDBOX_TMPFS_SIZE=${SANDBOX_TMPFS_SIZE:-100m}
      - SANDBOX_SECURITY_MODE=${SANDBOX_SECURITY_MODE:-permissive}
      - SANDBOX_DROP_CAPS=${SANDBOX_DROP_CAPS:-false}
      - SANDBOX_DEFAULT_TIMEOUT=${SANDBOX_DEFAULT_TIMEOUT:-30}
      - SANDBOX_DEFAULT_USER=${SANDBOX_DEFAULT_USER:-sandbox-user}
      - SANDBOX_DEFAULT_SHELL=${SANDBOX_DEFAULT_SHELL:-bash}
      - SANDBOX_READONLY_ROOT=${SANDBOX_READONLY_ROOT:-false}
      - SANDBOX_ENABLE_PRIVILEGED=${SANDBOX_ENABLE_PRIVILEGED:-false}
      - SANDBOX_ENABLE_SYS_ADMIN=${SANDBOX_ENABLE_SYS_ADMIN:-false}
    networks:
      - depthnet
    privileged: true                               # We need to control Docker
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - depthnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G

  browser-service:
    profiles: ["browser", "full"]
    build:
      context: ./browser-service
      dockerfile: Dockerfile
    environment:
      - BROWSER_SERVICE_PORT=3001
      - SESSION_TTL=${BROWSER_SESSION_TTL:-3600}
      - MAX_SESSIONS=${BROWSER_MAX_SESSIONS:-10}
      - SNAPSHOT_TEXT_LIMIT=${BROWSER_SNAPSHOT_TEXT_LIMIT:-3000}
      - SNAPSHOT_LINKS_LIMIT=${BROWSER_SNAPSHOT_LINKS_LIMIT:-30}
    networks:
      - depthnet
    restart: unless-stopped
    # Chrome needs /dev/shm larger than the default 64MB
    shm_size: '512mb'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  voice-service:
    ports:
      - "${VOICE_PORT:-3002}:3002"
    profiles: ["voice", "full"]
    build:
      context: ./voice-service
      dockerfile: Dockerfile
    environment:
      - VOICE_SERVICE_PORT=3002
      - STT_MODEL=${VOICE_STT_MODEL:-small}
      - STT_COMPUTE=${VOICE_STT_COMPUTE:-int8}
      - STT_BEAM_SIZE=${VOICE_STT_BEAM_SIZE:-5}
      - TTS_VOICES=${VOICE_TTS_VOICES:-en_US-lessac-medium}
      - MAX_AUDIO_MB=${VOICE_MAX_AUDIO_MB:-25}
      - MAX_TEXT_CHARS=${VOICE_MAX_TEXT_CHARS:-5000}
    volumes:
      - voice_models:/models
    networks:
      - depthnet
    restart: unless-stopped
    healthcheck:
      # start_period is generous on purpose: the first start downloads the
      # STT model, which can take minutes on a slow connection.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 600s
    deploy:
      resources:
        limits:
          # small/int8 ~500MB RSS; medium needs ~2G. Raise if you change the model.
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  sandbox_shared:
  redis_data:
  voice_models:

networks:
  depthnet:
    driver: bridge
